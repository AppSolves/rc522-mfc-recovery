name: Bug report
description: Report a reproducible software problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include real UIDs, keys, nonce files, dumps, or access-system data."
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: pi
    attributes:
      label: Raspberry Pi model and OS
    validations:
      required: true
  - type: input
    id: reader
    attributes:
      label: MFRC522 VersionReg
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
